# Гейты: панель (lint, типы, тесты, сборка) и сервер (формат, clippy, тесты)
# с уже встроенной панелью — так проверяется и то, что бинарь её отдаёт.
#
# Сторонние actions закреплены SHA коммита (комментарий — версия): тег можно
# перевесить, коммит — нет. Обновляет их dependabot.
name: CI

on:
  push:
    branches: ["master", "dev", "stable"]
  pull_request:
    branches: ["master", "dev", "stable"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: web lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web lint

      - name: Typecheck
        run: pnpm --dir web typecheck

      - name: Test
        run: pnpm --dir web test

      - name: Build
        run: pnpm --dir web build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  server:
    name: fmt / clippy / tests
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets
