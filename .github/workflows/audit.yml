# Проверка зависимостей сервера по базе RustSec — и по расписанию: advisory
# публикуются без изменений в коде.
name: Audit

on:
  push:
    branches: ["master", "dev", "stable"]
  pull_request:
    branches: ["master", "dev", "stable"]
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit

      - name: Server
        run: cargo audit
